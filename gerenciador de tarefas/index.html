<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href=".//css/style.css">
</head>
<body>
    <aside id="sidebar">
        <section  id="sidebar-content"></section>
        <button type="button"  id="calendario-btn">Calendário</button>
        <button type="button" id="indicadores-btn">Indicadores</button>
        <button type="button" id="filtros-btn">Filtros</button>
        <button type="button" id="config-btn">Configurações</button>

        <section id="filtros">
            <h2>Filtros</h2>
            <label for="filtro-categoria">Categoria:</label>
            <select id="filtro-categoria" name="filtro-categoria">
                <option value="">Todas</option>
                <option value="trabalho">Trabalho</option>
                <option value="pessoal">Pessoal</option>
            </select>

            <label for="filtro-prioridade">Prioridade:</label>
            <select id="filtro-prioridade" name="filtro-prioridade">
                <option value="">Todas</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
            </select>
        </section>
    </aside>

    <div id="conteudo-principal">
        <h1>Gerenciador de Tarefas</h1>

        <button id="btn-nova-tarefa" type="button">Nova tarefa</button>

        <form id="form-tarefa" class="oculto">
            <div id="modal-header">
            <span>Nova Tarefa</span>
           
            </div>
            <div> 
                <label for ="tarefa">Descrição da Tarefa:</label>
                <input type="text" id="tarefa" name="tarefa" required>
            </div>
            
            <div> 
                <label for ="categoria">Categoria:</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione</option>
                    <option value="trabalho">Trabalho</option>
                    <option value="pessoal">Pessoal</option>
                </select>
            </div>

            <div>
                <label for="data">Data de Conclusão:</label>
                <input type="date" id="data" name="data" required>
                
            </div>

            <div>
                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" name="prioridade" required>
                    <option value="">Selecione</option>
                    <option value="alta">Alta</option>
                    <option value="media">Média</option>
                    <option value="baixa">Baixa</option>
                </select>
            </div>

           <div>
                <button type="submit">Adicionar Tarefa</button>
            </div>
        </form> 

        <section>
            <h2>Tarefas Adicionadas</h2>
            <ul id="lista-tarefas">
                <p id="sem-tarefas">Nenhuma tarefa adicionada.</p>
            </ul>
        </section>

        <section>
            <h2> Tarefas Concluidas</h2>
            <ul id="lista-tarefas-concluidas">
                <p id="sem-tarefas-concluidas">Nenhuma tarefa concluída.</p>
            </ul>
        </section>
    </div>
</body>
</html>
